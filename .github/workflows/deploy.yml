name: Deploy to Oracle

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: 79.72.66.118
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          fingerprint: ${{ secrets.ORACLE_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail

            if [ -d ~/fuzzer-pipeline ]; then
              cd ~/fuzzer-pipeline
              git fetch origin
              if [ -n "$(git status --porcelain)" ]; then
                echo "fuzzer-pipeline checkout is dirty, refusing to deploy" >&2
                exit 1
              fi
              git checkout main
              git merge --ff-only origin/main
            else
              git clone https://github.com/r4xis/fuzzer-pipeline.git ~/fuzzer-pipeline
              cd ~/fuzzer-pipeline
            fi

            # Only the API is built and recreated: restarting the fuzzer
            # services or postgres would kill the running AFL++ campaign.
            docker compose build api
            docker compose up -d --no-deps api

            sleep 3 && curl -fsS 127.0.0.1:8000/programs > /dev/null

            deploy/build_frontend.sh

            sudo caddy validate --config deploy/Caddyfile --adapter caddyfile
            sudo cp deploy/Caddyfile /etc/caddy/Caddyfile
            sudo systemctl reload caddy

            curl -fsS --resolve r4xis.dev:443:127.0.0.1 https://r4xis.dev/ -o /dev/null
            curl -fsS --resolve r4xis.dev:443:127.0.0.1 https://r4xis.dev/api/programs -o /dev/null
            curl -fsS --resolve r4xis.dev:443:127.0.0.1 https://r4xis.dev/api/crashes -o /dev/null

            patch_status=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              --resolve r4xis.dev:443:127.0.0.1 https://r4xis.dev/api/crashes/1/status \
              -H 'Content-Type: application/json' -d '{"status":"reported"}')
            if [ "$patch_status" -ge 200 ] && [ "$patch_status" -lt 300 ]; then
              echo "PATCH /api/crashes/1/status should not succeed in public mode, got $patch_status" >&2
              exit 1
            fi

            # Defence in depth, checked directly against the API (bypassing
            # Caddy). PUBLIC_MODE now lists every finding (redacted, not
            # hidden), so for each target: (1) admin's visibility=private
            # override must be a no-op -- /crashes?target_id=<id> must return
            # exactly that target's total_crashes rows. Queried per target,
            # not from one global /crashes call grouped by target_id: /crashes
            # dedups crash_line globally, so a site shared by two targets is
            # attributed to only one of them there, but counted in both
            # targets' total_crashes -- grouping the global list would
            # under-count one target and fail the check for no real leak.
            # (2) no row marked withheld, in the list or in its own
            # /crashes/{id}, may carry a key outside the allowlist.
            python3 <<'PYEOF'
            import json
            import sys
            import urllib.request

            def get(path):
                with urllib.request.urlopen(f"http://127.0.0.1:8000{path}") as r:
                    return json.load(r)

            allowed = {"id", "status", "discovered_at", "target_id", "session_id", "withheld"}
            errors = []

            for t in get("/targets")["targets"]:
                tid = t["id"]
                expected = t["total_crashes"]
                crashes = get(f"/crashes?target_id={tid}&visibility=private")["crashes"]
                if len(crashes) != expected:
                    errors.append(f"target {tid}: /crashes count={len(crashes)}, /targets.total_crashes={expected}")

                for c in crashes:
                    if c.get("withheld") is not True:
                        continue
                    leaked = set(c.keys()) - allowed
                    if leaked:
                        errors.append(f"crash {c['id']}: list row leaks keys {sorted(leaked)}")
                    detail = get(f"/crashes/{c['id']}")
                    leaked_detail = set(detail.keys()) - allowed
                    if leaked_detail:
                        errors.append(f"crash {c['id']}: detail row leaks keys {sorted(leaked_detail)}")

            if errors:
                print("\n".join(errors), file=sys.stderr)
                sys.exit(1)
            PYEOF
